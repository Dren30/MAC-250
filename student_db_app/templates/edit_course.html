
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClassesDB | Edit Course</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        header {
            background-color: #1e293b;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            color: #cbd5e1;
            margin-bottom: 0;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        section {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: #1e293b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        input[readonly] {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .primary-button {
            background-color: #2563eb;
            color: white;
            margin-top: 20px;
        }

        .primary-button:hover {
            background-color: #1d4ed8;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            section {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ClassesDB</h1>
    <p>Course Management System</p>
</header>

<main>

    <section>

        <h2>Edit Course</h2>

        <form action="{{ url_for('update_course') }}" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label for="course_id">Course ID</label>

                    <input
                        type="number"
                        id="course_id"
                        name="course_id"
                        value="{{ course.course_id }}"
                        readonly
                    >
                </div>

                <div class="form-group">
                    <label for="course_name">Course Name</label>

                    <input
                        type="text"
                        id="course_name"
                        name="course_name"
                        maxlength="60"
                        value="{{ course.course_name }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="credits">Credits</label>

                    <input
                        type="number"
                        id="credits"
                        name="credits"
                        min="1"
                        value="{{ course.credits }}"
                        required
                    >
                </div>

            </div>

            <button type="submit" class="primary-button">
                Save Changes
            </button>

        </form>

        <a class="back-button" href="{{ url_for('courses') }}">
            ← Back to Courses
        </a>

    </section>

</main>

</body>
</html>
