
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClassesDB | Edit Course</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 0;
        }

        header {
            background-color: #1e293b;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            color: #cbd5e1;
            margin-bottom: 0;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        input[readonly] {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        /* BUTTONS */
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .cancel-button {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
        }

        .save-button {
            background-color: #2563eb;
            color: white;
        }

        .save-button:hover {
            background-color: #1d4ed8;
        }

        .cancel-button {
            background-color: #e2e8f0;
            color: #334155;
        }

        .cancel-button:hover {
            background-color: #cbd5e1;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            main {
                margin: 25px auto;
            }

            section {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ClassesDB</h1>
    <p>Course Management System</p>
</header>

<main>

    <section>

        <h2>Edit Course Information</h2>

        <p>
            Update the information for course
            <strong>{{ course.course_id }}</strong>.
        </p>

        <form
            action="{{ url_for('update_course') }}"
            method="POST"
        >

            <div class="form-group">

                <label for="course_id">Course ID</label>

                <input
                    type="number"
                    id="course_id"
                    name="course_id"
                    value="{{ course.course_id }}"
                    readonly
                >

            </div>

            <div class="form-group">

                <label for="course_name">Course Name</label>

                <input
                    type="text"
                    id="course_name"
                    name="course_name"
                    value="{{ course.course_name }}"
                    maxlength="60"
                    required
                >

            </div>

            <div class="form-group">

                <label for="credits">Credits</label>

                <input
                    type="number"
                    id="credits"
                    name="credits"
                    value="{{ course.credits }}"
                    min="1"
                    required
                >

            </div>

            <div class="buttons">

                <button type="submit" class="save-button">
                    Save Changes
                </button>

                <a
                    href="{{ url_for('courses') }}"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </section>

</main>

</body>
</html>
